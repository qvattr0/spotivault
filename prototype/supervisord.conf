; Prototype process tree. Everything runs as the "app" user (supervisord itself too).
[supervisord]
nodaemon=true
logfile=/config/logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/config/logs

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:dbus]
priority=10
command=/usr/bin/dbus-daemon --session --address=unix:path=/tmp/runtime-app/bus --nofork --nopidfile
autorestart=true
stdout_logfile=/config/logs/dbus.log
redirect_stderr=true

[program:xvfb]
priority=10
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24 -nolisten tcp
autorestart=true
stdout_logfile=/config/logs/xvfb.log
redirect_stderr=true

[program:pulseaudio]
priority=20
command=/usr/bin/pulseaudio -n -F /etc/pulse/spotivault.pa --daemonize=no --exit-idle-time=-1 --log-target=stderr
autorestart=true
stdout_logfile=/config/logs/pulseaudio.log
redirect_stderr=true

[program:openbox]
priority=20
command=/usr/bin/openbox
autorestart=true
stdout_logfile=/config/logs/openbox.log
redirect_stderr=true

[program:x11vnc]
priority=30
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -localhost -rfbport 5900 -quiet
autorestart=true
stdout_logfile=/config/logs/x11vnc.log
redirect_stderr=true

[program:novnc]
priority=30
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
autorestart=true
stdout_logfile=/config/logs/novnc.log
redirect_stderr=true

[program:spotify]
priority=40
startsecs=5
command=/usr/bin/spotify --no-zygote --no-sandbox --disable-gpu
; Spotify names its Connect device after the hostname; the shim makes that $DEVICE_NAME.
environment=LD_PRELOAD="/usr/local/lib/hostname-shim.so"
autorestart=true
stdout_logfile=/config/logs/spotify.log
redirect_stderr=true

[program:spytifyd]
priority=50
command=/usr/bin/spytifyd --log-file /config/logs/spytifyd-rotating.log
autorestart=true
stdout_logfile=/config/logs/spytifyd.log
redirect_stderr=true
