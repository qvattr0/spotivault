      value:
        steps:
          - { id: tos, state: done }
          - { id: client, state: done }
          - { id: login, state: done }
          - { id: client_settings, state: active }
          - { id: webapi, state: todo }
          - { id: output, state: todo }
          - { id: playlists, state: todo }
          - { id: albums, state: todo }
          - { id: done, state: todo }
        first_unfinished: client_settings
        completed: false
        tos_acknowledged_at: '2026-11-15T09:12:44Z'
