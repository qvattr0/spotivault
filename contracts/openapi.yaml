  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, details]
          additionalProperties: false
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message:
              type: string
              description: English, for logs. The UI words known codes itself.
            details:
              type: [object, 'null']
              description: Facts for the code, such as `field`, `reason`, `placeholder`, `ids` or `retry_after_s`.

    ErrorCode:
      type: string
      description: Every error code the API returns. New codes are additions, never renames.
      enum:
        - validation_failed
        - not_found
        - invalid_url
        - private
        - spotify_owned
        - already_added
        - not_removable
        - invalid_layout
        - run_active
        - no_run
        - not_paused
        - item_is_current
        - setup_incomplete
        - no_client_id
        - not_connected
        - connection_expired
        - client_not_installed
        - client_logged_out
        - install_in_progress
        - invalid_redirect
        - access_denied
        - state_mismatch
        - no_pending_auth
        - token_exchange_failed
        - rate_limited
        - spotify_unavailable
        - internal
        - forbidden

    SpotifyId:
      type: string
      pattern: '^[0-9A-Za-z]{22}$'
      description: A Spotify base-62 id.
      examples: [4glBZ0bZMgkmFyi6TD4h69]

    LibraryItemId:
      type: string
      pattern: '^(liked|[0-9A-Za-z]{22})$'
      description: A Spotify playlist id, or `liked` for Liked Songs.

    ItemId:
      type: string
      pattern: '^(liked|[0-9A-Za-z]{22})$'
      description: >-
        A Library item id or an album id. Playlist and album ids are both Spotify base-62 ids; the
        controller looks in the Library first, then in Albums.

    Health:
      type: object
      required: [status, version, boot_id, uptime_s, checks]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, starting, degraded]
          description: '`degraded` when a check below fails; the container stays healthy (200) so you can still reach the UI.'
        version: { type: string }
        boot_id:
          type: string
          description: Changes on every controller start. The WS `hello` carries it too.
        uptime_s: { type: integer, minimum: 0 }
        checks:
          type: object
          required: [db, display, pulseaudio, client]
          additionalProperties: false
          properties:
            db: { type: string, enum: [ok, fail] }
            display: { type: string, enum: [ok, fail] }
            pulseaudio: { type: string, enum: [ok, fail] }
            client:
              type: string
              enum: [not_installed, installing, stopped, running]

    SetupStepId:
      type: string
      enum: [tos, client, login, client_settings, webapi, output, playlists, albums, done]
      description: Wizard steps 1 to 9, in order.

    Setup:
      type: object
      required: [steps, first_unfinished, completed, tos_acknowledged_at]
      additionalProperties: false
      properties:
        steps:
          type: array
          minItems: 9
          maxItems: 9
          items:
            type: object
            required: [id, state]
            additionalProperties: false
            properties:
              id: { $ref: '#/components/schemas/SetupStepId' }
              state:
                type: string
                enum: [todo, active, done, failed]
              message:
                type: [string, 'null']
                description: Why a step failed, when it did.
        first_unfinished:
          oneOf:
            - $ref: '#/components/schemas/SetupStepId'
            - type: 'null'
        completed:
          type: boolean
          description: Until true, every UI route redirects to the wizard.
        tos_acknowledged_at:
          type: [string, 'null']
          format: date-time

    ClientInstall:
      type: object
      description: >-
        The runtime install of the Spotify client into `/config/spotify`, by `spotify-install`. Q13,
        resolved in S0: it takes about 18 s, so it's a wizard step.
      required: [state, phase, progress, bytes_done, bytes_total, version, previous_version, error, log_tail, started_at, finished_at]
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [not_started, installing, installed, failed]
        phase:
          oneOf:
            - type: string
              enum: [release, packages, download, unpack, libraries, switch]
              description: >-
                `release`: check InRelease with gpgv. `packages`: check Packages by sha256. `download`: the
                .deb and its sha256. `unpack`: dpkg-deb -x. `libraries`: ldd. `switch`: the `current` symlink.
            - type: 'null'
        progress:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: Overall progress, when known.
        bytes_done: { type: [integer, 'null'], minimum: 0 }
        bytes_total: { type: [integer, 'null'], minimum: 0 }
        version: { type: [string, 'null'] }
        previous_version:
          type: [string, 'null']
          description: The one previous version kept for rollback.
        error:
          oneOf:
            - type: object
              required: [code, message]
              additionalProperties: false
              properties:
                code:
                  type: string
                  enum: [network, signature, checksum, disk_full, missing_libraries, unknown]
                  description: '`missing_libraries` means the image is too old for this client: update the image.'
                message: { type: string }
            - type: 'null'
        log_tail:
          type: array
          maxItems: 50
          items: { type: string }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }

    ClientStatus:
      type: object
      required: [installed, version, running, logged_in, login_signals, device_name, restartable, install]
      additionalProperties: false
      properties:
        installed: { type: boolean }
        version: { type: [string, 'null'] }
        running: { type: boolean }
        logged_in:
          type: boolean
          description: >-
            Q2, resolved in S0: true when a `Users/*-user/` folder exists **and** the client's main
            window has a title other than plain "Spotify" ("Spotify Premium" when idle, "Artist -
            Title" while playing). A logged-out client still publishes MPRIS, so MPRIS isn't a signal.
            Wizard step 5 and the pre-run check also require the Web API device list to show our device.
        login_signals:
          type: object
          description: The raw signals behind `logged_in`, for the UI's diagnostics.
          required: [mpris, user_folder, window_title]
          additionalProperties: false
          properties:
            mpris:
              type: boolean
              description: The client's MPRIS name is on the bus. Reported, but not part of `logged_in`.
            user_folder: { type: boolean }
            window_title:
              type: [string, 'null']
              description: The client's main window title, or null when there's no window.
        device_name:
          type: string
          description: '`DEVICE_NAME`, the Connect device name.'
        restartable:
          type: boolean
          description: False during a run. The Player disables Restart client with its tooltip.
        install: { $ref: '#/components/schemas/ClientInstall' }

    ChecklistRowId:
      type: string
      enum: [crossfade, gapless, automix, autoplay, normalization, equalizer, mono, streaming_quality, auto_adjust_quality, volume]

    Checklist:
      type: object
      required: [rows, ready, checked_at]
      additionalProperties: false
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/ChecklistRow' }
        ready:
          type: boolean
          description: Every blocker row is OK (Auto) or ticked (Confirm). Step 4's Continue, and the pre-run check.
        checked_at: { type: string, format: date-time }

    ChecklistRow:
      type: object
      description: >-
        One row of the step 4 table. Q3, resolved in S0: automix, normalization, equalizer, mono,
        streaming quality and auto adjust are `auto`, read from the prefs file. Crossfade, gapless and
        autoplay are stored on Spotify's servers, so they're `confirm`. Volume is `set_for_you`. The UI
        still reads `check` rather than assuming it.
      required: [id, section, required, check, state, confirmed, blocker]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/ChecklistRowId' }
        section:
          type: string
          enum: [playback, audio_quality, player]
        required:
          type: string
          description: The value to set, as the client labels it.
        check:
          type: string
          enum: [auto, confirm, set_for_you]
        state:
          description: For `auto` rows. Null for the others.
          oneOf:
            - type: string
              enum: [ok, needs_change, unknown]
            - type: 'null'
        confirmed:
          type: [boolean, 'null']
          description: For `confirm` rows. Null for the others.
        blocker:
          type: boolean
          description: False for autoplay (the context-change check covers it) and volume (set for you).

    AuthStart:
      type: object
      required: [authorize_url, redirect_uri, expires_at]
      additionalProperties: false
      properties:
        authorize_url: { type: string, format: uri }
        redirect_uri:
          type: string
          const: http://127.0.0.1:8888/callback
        expires_at:
          type: string
          format: date-time
          description: When the pending PKCE verifier is dropped (15 minutes).

    Connection:
      type: object
      required: [state, display_name, user_id, client_id_masked, authorized_at, expires_at, scopes]
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [not_configured, disconnected, ok, expiring, expired]
          description: >-
            `not_configured`: no Client ID. `disconnected`: a Client ID but no token. `expiring`: within 4
            weeks of `expires_at` (the yellow banner). `expired`: past it, or Spotify answered
            `invalid_grant` (the red banner; scheduled runs are held).
        display_name: { type: [string, 'null'] }
        user_id: { type: [string, 'null'] }
        client_id_masked:
          type: [string, 'null']
          description: The first and last 4 characters.
        authorized_at: { type: [string, 'null'], format: date-time }
        expires_at:
          type: [string, 'null']
          format: date-time
          description: '`authorized_at` + 6 months. Refreshing never moves it.'
        scopes:
          type: array
          items: { type: string }

    Device:
      type: object
      required: [id, name, type, is_active]
      additionalProperties: false
      properties:
        id: { type: [string, 'null'] }
        name: { type: string }
        type: { type: string }
        is_active: { type: boolean }

    Devices:
      type: object
      required: [devices, ours, device_name]
      additionalProperties: false
      properties:
        devices:
          type: array
          items: { $ref: '#/components/schemas/Device' }
        ours:
          oneOf:
            - $ref: '#/components/schemas/Device'
            - type: 'null'
        device_name: { type: string }

    Volume:
      type: object
      required: [path, mounted, writable, free_bytes, total_bytes, error]
      additionalProperties: false
      properties:
        path: { type: string }
        mounted:
          type: boolean
          description: A separate mount, not the container's own filesystem.
        writable: { type: boolean }
        free_bytes: { type: [integer, 'null'], minimum: 0 }
        total_bytes: { type: [integer, 'null'], minimum: 0 }
        error:
          oneOf:
            - type: string
              enum: [not_mounted, not_writable, not_found]
            - type: 'null'

    Storage:
      type: object
      required: [music, config, min_free_bytes, ok]
      additionalProperties: false
      properties:
        music: { $ref: '#/components/schemas/Volume' }
        config: { $ref: '#/components/schemas/Volume' }
        min_free_bytes:
          type: integer
          const: 2000000000
          description: A run refuses to start below this much free space in `/music` (2 GB).
        ok:
          type: boolean
          description: '`/music` is mounted, writable, and has at least `min_free_bytes` free.'

    Layout:
      type: object
      description: >-
        How new recordings are named. Maps to Spytify's `output.*` settings; the rules and the mapping
        are in `vectors/layouts.json`.
      required: [pattern, prefix, underscores, strip_accents]
      additionalProperties: false
      properties:
        pattern:
          type: string
          maxLength: 200
          description: Between the fixed `Music/` and the extension. Default `{album_artist}/{album}/{track} - {title}`.
        prefix:
          type: string
          enum: [none, counter, track_number]
        underscores: { type: boolean }
        strip_accents: { type: boolean }

    Format:
      type: string
      enum: [aac, mp3, flac, wav]

    Settings:
      type: object
      required: [format, bitrate, extension, write_m3u, save_spotify_covers, auto_track_owned, layout]
      additionalProperties: false
      properties:
        format: { $ref: '#/components/schemas/Format' }
        bitrate:
          type: [integer, 'null']
          enum: [256, 320, null]
          description: 'Offered pairs: aac 256 (default), aac 320, mp3 320, flac null, wav null.'
        extension:
          type: string
          enum: [m4a, mp3, flac, wav]
          description: Read-only, from `format`.
        write_m3u: { type: boolean }
        save_spotify_covers: { type: boolean }
        auto_track_owned: { type: boolean }
        layout: { $ref: '#/components/schemas/Layout' }

    SettingsUpdate:
      type: object
      description: Any subset of Settings. `format` and `bitrate` go together.
      additionalProperties: false
      minProperties: 1
      properties:
        format: { $ref: '#/components/schemas/Format' }
        bitrate:
          type: [integer, 'null']
          enum: [256, 320, null]
        write_m3u: { type: boolean }
        save_spotify_covers: { type: boolean }
        auto_track_owned: { type: boolean }
        layout: { $ref: '#/components/schemas/Layout' }

    Container:
      type: object
      required: [device_name, tz, music_source, umask, ui_password_env_set, versions]
      additionalProperties: false
      properties:
        device_name: { type: string }
        tz: { type: string }
        music_source:
          type: [string, 'null']
          description: >-
            Where `/music` comes from, as the container's `/proc/self/mountinfo` shows it: the mounted
            folder's path inside its own file system. That's the host's full path only when the folder
            is on the host's root file system: a share at `/volume6/Music`, on a volume mounted at
            `/volume6`, shows as `/Music`. A whole file system mounted at `/music` shows its source,
            such as a device. Null when it can't be read. The container can't see the host's own mounts.
        umask: { type: string, pattern: '^[0-7]{3,4}$' }
        ui_password_env_set:
          type: boolean
          description: '`UI_PASSWORD` is set but not enforced in M1 (D11). Settings shows a warning.'
        versions:
          type: object
          required: [image, controller, spytify, client]
          additionalProperties: false
          properties:
            image: { type: string }
            controller: { type: string }
            spytify: { type: string }
            client: { type: [string, 'null'] }

    LibrarySummary:
      type: object
      required: [owned_count, owned_tracked, liked_tracked, added_count, tracked_count, auto_track_owned]
      additionalProperties: false
      properties:
        owned_count:
          type: integer
          minimum: 0
          description: Playlists you created. Step 7's "You have 23 playlists".
        owned_tracked: { type: integer, minimum: 0 }
        liked_tracked: { type: boolean }
        added_count:
          type: integer
          minimum: 0
          description: Followed and linked playlists in the Library.
        tracked_count:
          type: integer
          minimum: 0
          description: Every tracked item, Liked Songs included.
        auto_track_owned: { type: boolean }

    LibraryKind:
      type: string
      enum: [owned, liked, followed, linked]
      description: A followed playlist you collaborate on has item access and behaves like `owned`, but keeps its kind.

    LibraryStatus:
      type: string
      enum: [not_tracked, never_backed_up, up_to_date, new, partial, queued, recording, unavailable]
      description: The pill. `new` goes with the `new` count ("n new").

    ItemProgress:
      type: object
      description: Set while the item is in the current run; null otherwise.
      required: [run_id, state, recorded, planned]
      additionalProperties: false
      properties:
        run_id: { type: integer }
        state: { $ref: '#/components/schemas/ItemState' }
        recorded:
          type: integer
          minimum: 0
          description: Tracks recorded in this run so far.
        planned:
          type: [integer, 'null']
          minimum: 0
          description: Tracks this run plans to record. Null when the item plays whole (no item access).

    LibraryItem:
      type: object
      required: [id, kind, uri, name, owner, cover, cover_source, tracked, item_access, total, recorded, new, last_backup_at, status, removable, progress]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/LibraryItemId' }
        kind: { $ref: '#/components/schemas/LibraryKind' }
        uri: { type: string }
        name:
          type: string
          description: >-
            The playlist's name, or "Liked Songs". Always known: a linked playlist's comes from
            `GET /playlists/{id}` (S0, Q10).
        owner:
          type: string
          description: The owner's display name (their id when Spotify gives none), or `you`.
        cover:
          type: [string, 'null']
          description: A thumbnail URL under `/api/library/{id}/cover`. Null for Liked Songs, which shows its tile.
        cover_source:
          type: string
          enum: [custom, spotify, none]
          description: '`custom` is deferred, so M1 only sends `spotify` or `none`.'
        tracked: { type: boolean }
        item_access:
          type: boolean
          description: >-
            False for followed and linked playlists you don't collaborate on. Their track list is
            unknown.
        total:
          type: [integer, 'null']
          minimum: 0
          description: >-
            The playable tracks of its stored track list. Without one, a followed playlist's
            `items.total` from `GET /me/playlists` (every entry, playable or not: web-ui.md's
            "32 / 35 recorded"). Null for a linked playlist, whose total is unknown.
        recorded: { type: integer, minimum: 0 }
        new:
          type: [integer, 'null']
          minimum: 0
          description: Tracks added since the last backup. Null when unknown.
        last_backup_at: { type: [string, 'null'], format: date-time }
        status: { $ref: '#/components/schemas/LibraryStatus' }
        removable:
          type: boolean
          description: True for followed and linked items only.
        progress:
          oneOf:
            - $ref: '#/components/schemas/ItemProgress'
            - type: 'null'

    UrlBody:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          maxLength: 500

    PlaylistPreview:
      type: object
      description: >-
        A playlist that can be added. A followed one comes from the last catalog refresh's
        `GET /me/playlists`, with its total. A linked one comes from `GET /playlists/{id}`, which
        answers with its name, owner, cover and `snapshot_id` but no `items`, so its total is null,
        and its `/items` answers 403 (S0, Q10).
      required: [id, uri, name, owner, cover, kind, item_access, total, already_added]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/SpotifyId' }
        uri: { type: string }
        name: { type: string }
        owner:
          type: string
          description: The owner's display name, or their id when Spotify gives none.
        cover:
          type: [string, 'null']
          description: >-
            A Spotify CDN URL, used straight away and never stored. Null when the playlist has no
            image, or (a suggestion) when no refresh since the controller started has seen one.
        kind:
          type: string
          enum: [followed, linked]
        item_access:
          type: boolean
          description: False for a linked playlist, and for a followed one you don't collaborate on.
        total:
          type: [integer, 'null']
          minimum: 0
          description: '`items.total` for a followed playlist; null for a linked one (unknown).'
        already_added: { type: boolean }

    TrackState:
      type: string
      enum: [recorded, skipped_duplicate, missing, failed, new, unplayable]
      description: >-
        A track's state on a detail page. `missing`: not recorded and not new. `new`: added since the
        last backup. `unplayable`: a local file or `is_playable: false`; never recorded, left out of totals.

    ItemTrack:
      type: object
      required: [position, track_id, title, artists, album, duration_ms, state, size_bytes, path, reason, recorded_at]
      additionalProperties: false
      properties:
        position:
          type: [integer, 'null']
          minimum: 1
          description: Web API order, from 1. Null for tracks of a playlist without item access.
        track_id:
          oneOf:
            - $ref: '#/components/schemas/SpotifyId'
            - type: 'null'
        title: { type: string }
        artists:
          type: array
          items: { type: string }
        album: { type: [string, 'null'] }
        duration_ms: { type: [integer, 'null'], minimum: 0 }
        state: { $ref: '#/components/schemas/TrackState' }
        size_bytes: { type: [integer, 'null'], minimum: 0 }
        path:
          type: [string, 'null']
          description: Relative to the music folder, for the hover.
        reason:
          type: [string, 'null']
          description: The failure reason, for `failed`. Same values as TrackResult's `reason`.
        recorded_at: { type: [string, 'null'], format: date-time }

    TrackList:
      type: object
      required: [item_id, item_access, total, duration_ms, tracks]
      additionalProperties: false
      properties:
        item_id: { $ref: '#/components/schemas/ItemId' }
        item_access: { type: boolean }
        total: { type: [integer, 'null'], minimum: 0 }
        duration_ms:
          type: [integer, 'null']
          minimum: 0
          description: Sum over playable tracks. Null when unknown.
        tracks:
          type: array
          items: { $ref: '#/components/schemas/ItemTrack' }

    AlbumStatus:
      type: string
      enum: [queued, recording, recorded, partial, unavailable]

    Album:
      type: object
      required: [id, uri, name, artist, year, cover, total, recorded, status, added_at, completed_at, progress]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/SpotifyId' }
        uri: { type: string }
        name: { type: string }
        artist: { type: string }
        year: { type: [integer, 'null'] }
        cover: { type: [string, 'null'] }
        total:
          type: integer
          minimum: 0
          description: Playable tracks. Album totals are always known.
        recorded: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/AlbumStatus' }
        added_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        progress:
          oneOf:
            - $ref: '#/components/schemas/ItemProgress'
            - type: 'null'

    AlbumsSummary:
      type: object
      required: [total, recorded, queued, partial]
      additionalProperties: false
      properties:
        total: { type: integer, minimum: 0 }
        recorded: { type: integer, minimum: 0 }
        queued: { type: integer, minimum: 0 }
        partial: { type: integer, minimum: 0 }

    SavedAlbum:
      type: object
      required: [id, uri, name, artist, year, cover, total, saved_at]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/SpotifyId' }
        uri: { type: string }
        name: { type: string }
        artist: { type: string }
        year: { type: [integer, 'null'] }
        cover: { type: [string, 'null'] }
        total: { type: integer, minimum: 0 }
        saved_at: { type: string, format: date-time }

    Backlog:
      type: object
      description: >-
        design.md § Backlog estimate, with D13. `seconds_*` are whole seconds (milliseconds summed,
        then rounded half up). `seconds_left` adds 35 s per item with something to record; the other
        `seconds_*` are music only. `finish_at` is null with Manual only, or when nothing is left.
      required: [tracks_total, tracks_recorded, seconds_total, seconds_recorded, seconds_left, items_to_record, unknown_items, finish_at, as_of]
      additionalProperties: false
      properties:
        tracks_total: { type: integer, minimum: 0 }
        tracks_recorded: { type: integer, minimum: 0 }
        seconds_total: { type: integer, minimum: 0 }
        seconds_recorded: { type: integer, minimum: 0 }
        seconds_left: { type: integer, minimum: 0 }
        items_to_record: { type: integer, minimum: 0 }
        unknown_items:
          type: integer
          minimum: 0
          description: Tracked playlists without item access that will play whole (not Up to date by D13).
        finish_at:
          type: [string, 'null']
          format: date-time
        as_of: { type: string, format: date-time }

    RunState:
      type: string
      enum: [idle, starting, running, paused, stopping, finishing]
      description: >-
        `starting`: the pre-run check and catalog refresh. `finishing`: the ~25–30 s after an item, while
        the recorder saves the last track. `stopping`: a stop was asked for and is being carried out.

    Trigger:
      type: string
      enum: [scheduled, run_now, startup]
      description: '`run_now` covers Run now, Back up now, Record now and Retry failed.'

    PausedReason:
      type: string
      enum: [device_moved, device_busy]
      description: >-
        `device_moved`: playback moved to another device mid-run. `device_busy`: another device was
        already playing when the run started (D6); the run never takes playback from you.

    Counters:
      type: object
      required: [recorded, skipped_duplicate, skipped_other, failed, bytes_added]
      additionalProperties: false
      properties:
        recorded: { type: integer, minimum: 0 }
        skipped_duplicate: { type: integer, minimum: 0 }
        skipped_other:
          type: integer
          minimum: 0
          description: Ads and Spytify's other skip reasons.
        failed: { type: integer, minimum: 0 }
        bytes_added: { type: integer, minimum: 0 }

    RunSummary:
      type: object
      required: [id, trigger, state, started_at, window_end, paused_reason, stop_mode, counters]
      additionalProperties: false
      properties:
        id: { type: integer, minimum: 1 }
        trigger: { $ref: '#/components/schemas/Trigger' }
        state: { $ref: '#/components/schemas/RunState' }
        started_at: { type: string, format: date-time }
        window_end:
          type: [string, 'null']
          format: date-time
          description: The window's end, for scheduled and start-up runs ("stops by 07:00").
        paused_reason:
          oneOf:
            - $ref: '#/components/schemas/PausedReason'
            - type: 'null'
        stop_mode:
          type: [string, 'null']
          enum: [after_track, now, null]
          description: Set once a stop is asked for, including the end of a window (`after_track`).
        counters: { $ref: '#/components/schemas/Counters' }

    ItemState:
      type: string
      description: |
        An item's state in a run. While it's the current item: `planning`, `preflight`, `preparing`,
        `starting`, `playing`, `finishing` (the M1 plan's item states). Waiting: `up_next`, or
        `interrupted` (re-queued at the end after its first stall; "Interrupted · will retry"). Outcomes:
        - `done`: everything planned was recorded.
        - `up_to_date`: nothing to record (also D13's unchanged followed playlists); no recorder started.
        - `partial`: a second stall, failed takes, or a Spytify error; the run went on.
        - `stopped`: the run was stopped during or before it.
        - `carried_over`: cut off by the end of a window.
        - `failed`: the item couldn't run (recorder exit, timeout).
        - `unavailable`: 404 or 403 on a playlist that was available before.
        - `removed`: removed from the run while Up next.
      enum: [up_next, planning, preflight, preparing, starting, playing, finishing, interrupted, done, up_to_date, partial, stopped, carried_over, failed, unavailable, removed]

    ItemBadge:
      type: string
      enum: [up_to_date, interrupted_retried, interrupted_twice, carried_over_in, carried_over_out, removed, stopped]
      description: The run page's badges. `carried_over_in` is "Carried over from the previous run".

    QueueItem:
      type: object
      required: [item_id, kind, name, cover, state, attempt, planned, expect, counts, badges, reason]
      additionalProperties: false
      properties:
        item_id: { $ref: '#/components/schemas/ItemId' }
        kind:
          type: string
          enum: [owned, liked, followed, linked, album]
        name: { type: string }
        cover: { type: [string, 'null'] }
        state: { $ref: '#/components/schemas/ItemState' }
        attempt:
          type: integer
          minimum: 1
          maximum: 2
          description: 2 after an interruption. A second interruption ends it as `partial`.
        planned:
          type: [integer, 'null']
          minimum: 0
          description: Tracks planned, once planning is done. Null while unknown or when it plays whole.
        expect:
          type: object
          description: The Up next row's "84 new", "11 tracks" or "checking".
          required: [kind, count]
          additionalProperties: false
          properties:
            kind:
              type: string
              enum: [new_tracks, tracks, checking]
            count: { type: [integer, 'null'], minimum: 0 }
        counts:
          type: object
          required: [recorded, skipped, failed]
          additionalProperties: false
          properties:
            recorded: { type: integer, minimum: 0 }
            skipped: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
        badges:
          type: array
          items: { $ref: '#/components/schemas/ItemBadge' }
        reason:
          type: [string, 'null']
          description: 'Why it ended as it did, in English ("2 tracks failed: low volume").'

    RunTrackState:
      type: string
      enum: [pending, recording, recorded, skipped_duplicate, skipped, failed]

    RunTrack:
      type: object
      description: A row of the current item's live track table.
      required: [position, track_id, title, artists, duration_ms, state, size_bytes, reason, take_id]
      additionalProperties: false
      properties:
        position: { type: [integer, 'null'], minimum: 1 }
        track_id:
          oneOf:
            - $ref: '#/components/schemas/SpotifyId'
            - type: 'null'
        title: { type: string }
        artists:
          type: array
          items: { type: string }
        duration_ms: { type: [integer, 'null'], minimum: 0 }
        state: { $ref: '#/components/schemas/RunTrackState' }
        size_bytes: { type: [integer, 'null'], minimum: 0 }
        reason: { type: [string, 'null'] }
        take_id:
          type: [string, 'null']
          description: Spytify's take id, once a take started.

    NowPlaying:
      type: object
      required: [take_id, track_id, title, artist, album, cover_url, length_ms, started_at, position]
      additionalProperties: false
      properties:
        take_id: { type: string }
        track_id:
          oneOf:
            - $ref: '#/components/schemas/SpotifyId'
            - type: 'null'
        title: { type: string }
        artist:
          type: string
          description: The first artist, as MPRIS gives it.
        album: { type: [string, 'null'] }
        cover_url: { type: [string, 'null'] }
        length_ms: { type: integer, minimum: 0 }
        started_at: { type: string, format: date-time }
        position:
          type: [integer, 'null']
          minimum: 1
          description: The track's position in the item, when matched.

    SessionState:
      type: string
      enum: [idle, waiting, recording, ad, paused, stopping]
      description: Spytify's `session.state`, relayed. The pill shows Waiting, Recording, Paused or Stopping.

    Status:
      type: object
      required: [state, run, item, track, session_state, view_only]
      additionalProperties: false
      properties:
        state: { $ref: '#/components/schemas/RunState' }
        run:
          oneOf:
            - $ref: '#/components/schemas/RunSummary'
            - type: 'null'
        item:
          oneOf:
            - $ref: '#/components/schemas/QueueItem'
            - type: 'null'
        track:
          oneOf:
            - $ref: '#/components/schemas/NowPlaying'
            - type: 'null'
        session_state:
          oneOf:
            - $ref: '#/components/schemas/SessionState'
            - type: 'null'
        view_only:
          type: boolean
          description: The Player locks input (any state but `idle`).

    CurrentRun:
      type: object
      required: [run, queue, current_tracks]
      additionalProperties: false
      properties:
        run:
          oneOf:
            - $ref: '#/components/schemas/RunSummary'
            - type: 'null'
        queue:
          type: array
          description: Every item of the run in display order. Finished items first, then the current one, then Up next and interrupted ones.
          items: { $ref: '#/components/schemas/QueueItem' }
        current_tracks:
          type: array
          items: { $ref: '#/components/schemas/RunTrack' }

    RunCreated:
      type: object
      required: [run_id, started, added]
      additionalProperties: false
      properties:
        run_id: { type: integer, minimum: 1 }
        started:
          type: boolean
          description: True when a new run started; false when the items joined the current run.
        added:
          type: array
          items: { $ref: '#/components/schemas/ItemId' }
          description: >-
            A new run: the `items` given, or empty for Run now. Joining a run: the items that now
            wait right after the current item, in the given order, both new ones and ones already
            waiting that moved there. The current item, and items that already ended or were
            removed in this run, are left out: a run has one row per item.

    Outcome:
      type: string
      enum: [completed, completed_with_issues, window_ended, stopped, failed]

    HistoryRow:
      type: object
      required: [id, kind, trigger, started_at, ended_at, duration_s, outcome, counters, reason, window]
      additionalProperties: false
      properties:
        id: { type: integer, minimum: 1 }
        kind:
          type: string
          enum: [run, missed, skipped, held]
          description: >-
            `missed`: spotivault was not running. `skipped`: the previous run was paused. `held`: the
            Spotify connection expired, or the client was logged out. Only `run` rows have counts.
        trigger: { $ref: '#/components/schemas/Trigger' }
        started_at:
          type: string
          format: date-time
          description: For rows with no run, the window's start.
        ended_at: { type: [string, 'null'], format: date-time }
        duration_s: { type: [integer, 'null'], minimum: 0 }
        outcome:
          oneOf:
            - $ref: '#/components/schemas/Outcome'
            - type: 'null'
        counters:
          oneOf:
            - $ref: '#/components/schemas/Counters'
            - type: 'null'
        reason:
          type: [string, 'null']
          description: >-
            A machine reason for `failed` and the no-run rows: `container_restarted`, `setting_drifted`,
            `client_logged_out`, `connection_expired`, `not_running`, `previous_paused`,
            `storage`, `device_missing`, `recorder`.
        window:
          oneOf:
            - type: object
              required: [start, end]
              additionalProperties: false
              properties:
                start: { type: string, format: date-time }
                end: { type: string, format: date-time }
            - type: 'null'

    RunItem:
      type: object
      required: [item_id, kind, name, cover, order, state, badges, counts, bytes, started_at, ended_at, reason, can_retry]
      additionalProperties: false
      properties:
        item_id: { $ref: '#/components/schemas/ItemId' }
        kind:
          type: string
          enum: [owned, liked, followed, linked, album]
        name: { type: string }
        cover: { type: [string, 'null'] }
        order:
          type: integer
          minimum: 1
          description: The order it ran in.
        state: { $ref: '#/components/schemas/ItemState' }
        badges:
          type: array
          items: { $ref: '#/components/schemas/ItemBadge' }
        counts:
          type: object
          required: [recorded, skipped, failed]
          additionalProperties: false
          properties:
            recorded: { type: integer, minimum: 0 }
            skipped: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
        bytes: { type: integer, minimum: 0 }
        started_at: { type: [string, 'null'], format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
        reason: { type: [string, 'null'] }
        can_retry:
          type: boolean
          description: It has failed tracks, and it's still in the Library or Albums. Shows Retry failed.

    RunDetail:
      type: object
      required: [run, items]
      additionalProperties: false
      properties:
        run: { $ref: '#/components/schemas/HistoryRow' }
        items:
          type: array
          items: { $ref: '#/components/schemas/RunItem' }

    TrackResult:
      type: object
      required: [position, track_id, title, artists, result, reason, size_bytes, path, take_id, at]
      additionalProperties: false
      properties:
        position: { type: [integer, 'null'], minimum: 1 }
        track_id:
          oneOf:
            - $ref: '#/components/schemas/SpotifyId'
            - type: 'null'
        title: { type: string }
        artists:
          type: array
          items: { type: string }
        result:
          type: string
          enum: [recorded, skipped, failed]
        reason:
          type: [string, 'null']
          description: |
            - `skipped`: Spytify's skip reason: `duplicate`, `ad`, `too_short`, `incomplete`, `seeked`,
              `low_quality` or `silent`.
            - `failed`: `low_volume`, `recorder_error`, `unavailable`, `interrupted` or `discarded`
              (Stop now).
        size_bytes: { type: [integer, 'null'], minimum: 0 }
        path:
          type: [string, 'null']
          description: Relative to the music folder.
        take_id: { type: [string, 'null'] }
        at: { type: string, format: date-time }

    LastRun:
      type: object
      required: [run, issues]
      additionalProperties: false
      properties:
        run:
          oneOf:
            - $ref: '#/components/schemas/HistoryRow'
            - type: 'null'
        issues:
          type: array
          maxItems: 3
          items:
            type: object
            required: [item_id, name, message]
            additionalProperties: false
            properties:
              item_id: { $ref: '#/components/schemas/ItemId' }
              name: { type: string }
              message:
                type: string
                description: 'One line: "2 tracks failed: low volume".'

    RunOrderGroup:
      type: string
      enum: [carried_over, liked, playlists, albums]

    Hours:
      type: object
      description: >-
        Each list holds the active hours of that day (0–23), local time in `TZ`. All lists empty means
        Manual only. Contiguous hours form one window, across midnight and from Sunday to Monday.
      required: [mon, tue, wed, thu, fri, sat, sun]
      additionalProperties: false
      properties:
        mon: { $ref: '#/components/schemas/DayHours' }
        tue: { $ref: '#/components/schemas/DayHours' }
        wed: { $ref: '#/components/schemas/DayHours' }
        thu: { $ref: '#/components/schemas/DayHours' }
        fri: { $ref: '#/components/schemas/DayHours' }
        sat: { $ref: '#/components/schemas/DayHours' }
        sun: { $ref: '#/components/schemas/DayHours' }

    DayHours:
      type: array
      maxItems: 24
      uniqueItems: true
      items: { type: integer, minimum: 0, maximum: 23 }

    Schedule:
      type: object
      required: [hours, tz, run_order, windows_per_week, hours_per_week]
      additionalProperties: false
      properties:
        hours: { $ref: '#/components/schemas/Hours' }
        tz:
          type: string
          description: Read-only. Set by `TZ`.
        run_order:
          type: array
          minItems: 4
          maxItems: 4
          uniqueItems: true
          items: { $ref: '#/components/schemas/RunOrderGroup' }
        windows_per_week: { type: integer, minimum: 0 }
        hours_per_week: { type: integer, minimum: 0, maximum: 168 }

    ScheduleUpdate:
      type: object
      required: [hours]
      additionalProperties: false
      properties:
        hours: { $ref: '#/components/schemas/Hours' }
        tz:
          type: string
          description: Ignored.
        run_order:
          type: array
          minItems: 4
          maxItems: 4
          uniqueItems: true
          items: { $ref: '#/components/schemas/RunOrderGroup' }
          description: Left out keeps the stored order. The drag UI is deferred, so M1 keeps the default.

    ScheduleNext:
      type: object
      required: [at, window_end, in_progress, playlists_to_check, albums_queued, held_reason]
      additionalProperties: false
      properties:
        at:
          type: [string, 'null']
          format: date-time
          description: The start of the first window that hasn't ended. Null with Manual only.
        window_end: { type: [string, 'null'], format: date-time }
        in_progress:
          type: boolean
          description: Now is inside that window.
        playlists_to_check: { type: integer, minimum: 0 }
        albums_queued:
          type: integer
          minimum: 0
          description: Queued and Partial albums.
        held_reason:
          type: [string, 'null']
          enum: [connection_expired, not_connected, client_logged_out, run_paused, setup_incomplete, null]
          description: Why the next scheduled run won't start. The card turns red.

    WebApiUsage:
      type: object
      required: [days, from, to, totals, by_day, rate_limits, warnings]
      additionalProperties: false
      properties:
        days: { type: integer, minimum: 1, maximum: 90 }
        from: { type: string, format: date }
        to: { type: string, format: date }
        totals:
          type: object
          required: [requests, retried, rate_limited, errors_4xx, errors_5xx]
          additionalProperties: false
          properties:
            requests: { type: integer, minimum: 0 }
            retried:
              type: integer
              minimum: 0
              description: Rows with attempt > 1.
            rate_limited: { type: integer, minimum: 0 }
            errors_4xx: { type: integer, minimum: 0 }
            errors_5xx: { type: integer, minimum: 0 }
        by_day:
          type: array
          items:
            type: object
            required: [day, method, endpoint, lane, requests, retried, rate_limited, status_2xx, status_4xx, status_5xx, p50_ms, p95_ms]
            additionalProperties: false
            properties:
              day: { type: string, format: date }
              method: { type: string, enum: [GET, PUT, POST, DELETE] }
              endpoint:
                type: string
                description: An endpoint template, never an id.
              lane: { type: string, enum: [catalog, playback, auth] }
              requests: { type: integer, minimum: 0 }
              retried: { type: integer, minimum: 0 }
              rate_limited: { type: integer, minimum: 0 }
              status_2xx: { type: integer, minimum: 0 }
              status_4xx: { type: integer, minimum: 0 }
              status_5xx: { type: integer, minimum: 0 }
              p50_ms: { type: [integer, 'null'], minimum: 0 }
              p95_ms: { type: [integer, 'null'], minimum: 0 }
        rate_limits:
          type: array
          description: Every 429 in the period, newest first.
          items:
            type: object
            required: [at, method, endpoint, retry_after_s, scope]
            additionalProperties: false
            properties:
              at: { type: string, format: date-time }
              method: { type: string }
              endpoint: { type: string }
              retry_after_s: { type: [integer, 'null'], minimum: 0 }
              scope:
                type: string
                description: >-
                  `run:<id>`, `refresh:<id>`, `setup` (the code exchange in wizard step 5) or
                  `other`.
        warnings:
          type: array
          description: The usage-log warnings raised in the period (also in the controller log).
          items:
            type: object
            required: [at, kind, message]
            additionalProperties: false
            properties:
              at: { type: string, format: date-time }
              kind:
                type: string
                enum: [rate_limited, burst, repeated_4xx, above_median]
                description: >-
                  `burst`: more than the threshold (default 30) in 30 s. `repeated_4xx`: five or more 4xx in
                  a row from one endpoint. `above_median`: a refresh or run with more than twice its 7-day
                  median of requests.
              message: { type: string }
