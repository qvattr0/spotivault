openapi: 3.1.0
info:
  title: spotivault controller API
  version: 0.1.0-m1
  summary: REST API of the spotivault controller, for the M1 vertical slice.
  description: |
    The controller serves this API and the web UI on port 8080. It's the M1 subset of the
    endpoint tables in `docs/web-ui.md`, plus the additions in the M1 plan.

    **Conventions:**
    - **JSON:** snake_case field names. Fields that can be unknown are present and `null`, never left out.
    - **Times:** RFC 3339. Event and record times are UTC (`Z`). Schedule windows and `finish_at` carry
      the offset of the container's `TZ`, because they're wall-clock times.
    - **Errors:** every 4xx and 5xx body is an `Error`: `{"error": {"code", "message", "details"}}`.
      The UI keys its wording on `code`. `message` is English, for logs.
    - **Ids:** a Library item's id is its Spotify playlist id, or `liked` for Liked Songs. An album's id
      is its Spotify album id. Runs have integer ids.
    - **Auth:** none in M1. `UI_PASSWORD` isn't enforced (plan D11): if it's set, `GET /api/container`
      says so, and the controller logs a warning.
    - **Other sites' pages:** every request, WebSockets included, must name the controller by an IP
      address, `localhost`, a name without a dot, a name ending in `.local`, `.lan`, `.internal`,
      `.home.arpa` or `.localhost`, or a name in `SPOTIVAULT_ALLOWED_HOSTS`. A POST, PUT, PATCH or
      DELETE whose `Origin` is another site's is refused too. Both get 403 `forbidden`, which no
      operation lists. A request without a `Host` or `Origin` header passes that check: it isn't a
      browser's.
    - **Live updates:** `WS /api/events`, described in `events.md` next to this file. The noVNC
      bridge is `WS /vnc`. Both are listed under `x-websockets`, since OpenAPI has no WebSocket operations.

    **S0's answers:** step S0 answered open questions Q2, Q3, Q9, Q10 and Q13 (web-ui.md § Open
    questions), and every shape follows them. Q2, Q3 and Q13 were settled in S4, Q9 and Q10 in S5:
    Liked Songs plays as a context, so `LibraryItem` has no playback note; a linked playlist's name,
    owner and cover come from `GET /playlists/{id}`, so they're always known.

    **Left out (deferred UI features):** the Schedule page's preview, notifications, the UI password,
    custom cover uploads, History's Tracks and Logs tabs, and the logs zip.
  contact:
    name: spotivault
    url: https://github.com/qvattr0/spotivault
  license:
    name: All rights reserved
    url: https://github.com/qvattr0/spotivault
servers:
  - url: http://localhost:8080
    description: The controller, as published by the local docker-compose.yml.
tags:
  - name: albums
    description: Albums added for recording.
  - name: client
    description: The Spotify Linux client in the container.
  - name: history
    description: Past runs, including missed, skipped and held rows.
  - name: library
    description: Playlists and Liked Songs.
  - name: runs
    description: The current run, Run now, stop and resume.
  - name: schedule
    description: The weekly hour grid and the next window. The grid's UI is deferred (plan D5).
  - name: settings
    description: Settings, storage and container facts.
  - name: setup
    description: The setup wizard, steps 1 to 9.
  - name: spotify
    description: The Spotify Web API connection.
  - name: system
    description: Health and the Web API usage log.
x-websockets:
  - path: /api/events
    description: >-
      Live events. Envelope `{seq, type, at, data}`, a `hello` snapshot on connect. See `events.md`.
      Pages from another site get 403.
  - path: /vnc
    description: >-
      noVNC's RFB-over-WebSocket. The controller bridges it to x11vnc on localhost (plan D9).
      Binary frames, subprotocol `binary`. Used by wizard steps 3 and 4 and the Player.
      Closes with 1013 while the VNC server isn't up, 1000 when the VNC server ends the connection,
      and 1003 on a text frame. Pages from another site get 403.
paths:
  /api/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Container health
      description: >-
        The Docker healthcheck. 200 while the controller runs and its database is open, even before
        setup is done. 503 when the database can't be opened.
      responses:
        '200':
          description: Healthy, or starting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              examples:
                ok:
                  value:
                    status: ok
                    version: 0.1.0
                    boot_id: 7f3c9a10-5b2e-4c55-9d0e-2f1a6b7c8d90
                    uptime_s: 3605
                    checks: { db: ok, display: ok, pulseaudio: ok, client: running }
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/setup:
    get:
      tags: [setup]
      operationId: getSetup
      summary: Each wizard step's state
      description: Each step's state, plus the first unfinished step. The WS `setup.state` event carries the same object.
      responses:
        '200':
          description: The setup state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Setup' }
              examples:
                midway:
                  $ref: '#/components/examples/SetupMidway'

  /api/setup/tos:
    post:
      tags: [setup]
      operationId: acknowledgeTos
      summary: Acknowledge the Terms notice (step 1)
      description: Stores the acknowledgement and its timestamp. Calling it again keeps the first timestamp.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [understood]
              additionalProperties: false
              properties:
                understood:
                  type: boolean
                  const: true
            example: { understood: true }
      responses:
        '200':
          description: The setup state after the acknowledgement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Setup' }
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/setup/restart:
    post:
      tags: [setup]
      operationId: restartSetup
      summary: Run setup again (Settings › About)
      description: >-
        Reopens the wizard from step 2. Step 1 stays done, so the Terms notice doesn't show again.
        Nothing is deleted: tokens, settings, the Library and History are kept, and each step shows its
        current state. Refused during a run.
      responses:
        '200':
          description: The setup state, with `first_unfinished` set to `client`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Setup' }
        '409':
          $ref: '#/components/responses/RunActive'

  /api/setup/complete:
    post:
      tags: [setup]
      operationId: completeSetup
      summary: Finish the wizard (step 9's Open Library and Back up now)
      description: >-
        Marks steps 7 to 9 done and `completed` true. Steps 7 and 8 are choices with defaults, so
        they're accepted as they are; step 8's "I'll choose in Albums" needs no call of its own.
        Refused with 409 `setup_incomplete`, listing the steps in `details.steps`, while a step from
        1 to 6 isn't done. Calling it again once setup is complete changes nothing.
      responses:
        '200':
          description: The setup state, with `completed` true and `first_unfinished` null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Setup' }
        '409':
          description: A step from 1 to 6 isn't done (`setup_incomplete`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                incomplete:
                  value:
                    error:
                      code: setup_incomplete
                      message: 'Finish the setup steps first: webapi.'
                      details: { steps: [webapi] }

  /api/setup/checklist/confirm:
    post:
      tags: [setup]
      operationId: confirmChecklist
      summary: Tick or untick Confirm rows (step 4)
      description: >-
        "I've set these". Only rows whose `check` is `confirm` can be ticked: crossfade, gapless and
        autoplay (Q3, resolved in S0). Any other row is refused with `validation_failed`, with
        `details.field` set to `rows.<id>`, and nothing is changed. The UI still reads `check` from
        `GET /api/client/checklist` rather than hard-coding it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              additionalProperties: false
              properties:
                rows:
                  type: object
                  description: Row id to ticked (true) or unticked (false).
                  propertyNames: { $ref: '#/components/schemas/ChecklistRowId' }
                  additionalProperties: { type: boolean }
            example:
              rows: { autoplay: false, crossfade: true, gapless: true }
      responses:
        '200':
          description: The checklist after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checklist' }
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/client/status:
    get:
      tags: [client]
      operationId: getClientStatus
      summary: The Spotify client's install and login state
      description: >-
        Used by wizard steps 2 and 3, Settings › Spotify client and the Player's status strip. The WS
        `client.status` event carries the same object, and `client.install` carries install progress.
      responses:
        '200':
          description: The client's state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientStatus' }
              examples:
                loggedIn:
                  $ref: '#/components/examples/ClientLoggedIn'

  /api/client/install:
    post:
      tags: [client]
      operationId: installClient
      summary: Install or retry the client install (step 2)
      description: >-
        Starts the install in the background and returns at once. Progress arrives as WS
        `client.install` events. Refused while an install is running, and during a run. On its
        first start, the controller installs a missing client by itself (web-ui.md step 2), so this
        is the step's Retry.
      responses:
        '202':
          description: The install started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientInstall' }
        '409':
          description: An install is already running (`install_in_progress`), or a run is active (`run_active`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                installing:
                  value:
                    error: { code: install_in_progress, message: The client install is already running., details: null }

  /api/client/checklist:
    get:
      tags: [client]
      operationId: getClientChecklist
      summary: The client settings checklist (step 4)
      description: >-
        Reads every Auto row again on each call, so it's also the Re-check button. Shared with
        Settings › Spotify client and the pre-run check.
      responses:
        '200':
          description: The checklist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checklist' }
              examples:
                defaultM1:
                  $ref: '#/components/examples/ChecklistM1'

  /api/client/restart:
    post:
      tags: [client]
      operationId: restartClient
      summary: Restart the client
      description: >-
        "Reset login screen" in step 3, and the Player's Restart client. It's also how you get a fresh
        login QR code. Refused with 409 `run_active` during a run.
      responses:
        '202':
          description: The restart started. `client.status` events follow.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientStatus' }
        '409':
          $ref: '#/components/responses/RunActive'

  /api/spotify/app:
    post:
      tags: [spotify]
      operationId: setSpotifyApp
      summary: Store the developer app's Client ID (step 5)
      description: >-
        Changing it to a different id disconnects: the token is deleted and the state becomes
        `disconnected` until you authorize again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              additionalProperties: false
              properties:
                client_id:
                  type: string
                  pattern: '^[0-9a-f]{32}$'
            example: { client_id: 0123456789abcdef0123456789abcdef }
      responses:
        '200':
          description: The connection after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        '409':
          $ref: '#/components/responses/RunActive'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/spotify/auth/start:
    post:
      tags: [spotify]
      operationId: startSpotifyAuth
      summary: Get the authorize URL (step 5)
      description: >-
        Returns Spotify's consent URL, with PKCE. The verifier stays on the server, in `pkce_pending`,
        for 15 minutes. A new call replaces any pending one.
      responses:
        '200':
          description: The authorize URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthStart' }
        '409':
          description: No Client ID is stored yet (`no_client_id`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/spotify/auth/finish:
    post:
      tags: [spotify]
      operationId: finishSpotifyAuth
      summary: Paste back the redirect address (step 5)
      description: >-
        Body `{redirect_url}`: the whole `http://127.0.0.1:8888/callback?...` address from the browser.
        Exchanges the code for tokens, stores `authorized_at`, and returns the connection with the
        display name. Reconnecting resets the 6-month clock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirect_url]
              additionalProperties: false
              properties:
                redirect_url:
                  type: string
                  maxLength: 4096
            example:
              redirect_url: http://127.0.0.1:8888/callback?code=AQB3x...&state=k7Qm2c
      responses:
        '200':
          description: Connected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
              examples:
                ok:
                  $ref: '#/components/examples/ConnectionOk'
        '422':
          description: >-
            The address can't be used. `invalid_redirect` (not a callback address), `access_denied`
            (you declined), `state_mismatch`, `no_pending_auth` (expired or never started), or
            `token_exchange_failed` (Spotify refused the code).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                stateMismatch:
                  value:
                    error:
                      code: state_mismatch
                      message: The address belongs to an older authorization. Press Authorize again.
                      details: null

  /api/spotify/devices:
    get:
      tags: [spotify]
      operationId: getSpotifyDevices
      summary: Connect devices, and whether ours is one (step 5)
      description: >-
        One `GET /me/player/devices` call. `ours` is the device whose name matches `DEVICE_NAME`,
        ignoring case. Other computers on the account are listed but never picked.
      responses:
        '200':
          description: The device list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Devices' }
        '409':
          $ref: '#/components/responses/NotConnected'
        '503':
          $ref: '#/components/responses/SpotifyUnavailable'

  /api/spotify/connection:
    get:
      tags: [spotify]
      operationId: getSpotifyConnection
      summary: The Web API connection
      description: Used by step 5, the expiry banner and Settings › Spotify account. The WS `connection` event carries the same object.
      responses:
        '200':
          description: The connection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
              examples:
                ok:
                  $ref: '#/components/examples/ConnectionOk'
    delete:
      tags: [spotify]
      operationId: disconnectSpotify
      summary: Disconnect (Settings › Spotify account)
      description: Deletes the token. The Client ID is kept. Scheduled runs are held until you reconnect.
      responses:
        '200':
          description: The connection, now `disconnected`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        '409':
          $ref: '#/components/responses/RunActive'

  /api/storage:
    get:
      tags: [settings]
      operationId: getStorage
      summary: The music folder check (step 6, Settings › Files)
      description: Whether `/music` is a mounted volume and writable, plus free space. Writes and deletes a probe file as the `app` user.
      responses:
        '200':
          description: The storage state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Storage' }

  /api/settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: Settings
      description: The saved settings. The page's Save bar sends changes with PUT.
      responses:
        '200':
          description: The saved settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
              examples:
                defaults:
                  $ref: '#/components/examples/SettingsDefault'
    put:
      tags: [settings]
      operationId: putSettings
      summary: Save settings
      description: >-
        Fields left out keep their value, so wizard step 7 can send `{auto_track_owned}` alone. A change
        saved during a run applies from the next item. An invalid layout is refused with 422
        `invalid_layout`; its `details.reason` is one of the reasons in `vectors/layouts.json`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsUpdate' }
            examples:
              step7:
                value: { auto_track_owned: true }
              layout:
                value:
                  layout: { pattern: '{album_artist}/{album}/{track} - {title}', prefix: none, underscores: false, strip_accents: false }
      responses:
        '200':
          description: The saved settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '422':
          description: >-
            `invalid_layout` (with `details.reason` and `details.placeholder` when one is unknown), or
            `validation_failed` (for example a format and bitrate that aren't offered together).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                unknownPlaceholder:
                  value:
                    error:
                      code: invalid_layout
                      message: '{genre} is not a placeholder.'
                      details: { reason: unknown_placeholder, placeholder: '{genre}' }

  /api/container:
    get:
      tags: [settings]
      operationId: getContainer
      summary: Read-only container facts (Settings › Container)
      description: Environment values and versions, with the note "Change these in the UGOS Docker app".
      responses:
        '200':
          description: Environment values and versions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Container' }

  /api/library/summary:
    get:
      tags: [library]
      operationId: getLibrarySummary
      summary: Playlist counts (steps 7 and 9)
      description: How many playlists you created, and what's tracked. Step 7's choice cards and step 9's summary read it.
      responses:
        '200':
          description: The counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibrarySummary' }

  /api/library:
    get:
      tags: [library]
      operationId: listLibrary
      summary: The Library's items
      description: >-
        Filters, searches and sorts on the server. Liked Songs is always first when it matches the
        filter. No paging: a Library holds hundreds of items at most.
      parameters:
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, tracked, not_tracked, owned, added]
            default: all
          description: '`owned` is "Created by you" (owned playlists and Liked Songs); `added` is followed and linked playlists.'
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
          description: Case-insensitive substring of the name.
        - name: sort
          in: query
          description: The Library's sort menu. Ties sort by name.
          schema:
            type: string
            enum: [recently_backed_up, name, recently_added, track_count]
            default: recently_backed_up
      responses:
        '200':
          description: The items.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LibraryItem' }
              examples:
                twoItems:
                  $ref: '#/components/examples/LibraryList'
    post:
      tags: [library]
      operationId: addLibraryItem
      summary: Add a followed or linked playlist (+ modal)
      description: >-
        Body `{url}`: an `https://open.spotify.com/playlist/…` link or a `spotify:playlist:…` URI. The
        item comes in tracked.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UrlBody' }
            example: { url: 'https://open.spotify.com/playlist/37i9dQZF1DXcBWIGoYBM5M?si=abc' }
      responses:
        '201':
          description: The added item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryItem' }
        '409':
          description: >-
            Already in the Library (`already_added`), checked before asking Spotify. Or the Web API
            isn't connected (`not_connected`), or the connection expired (`connection_expired`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/LinkRefused'
        '503':
          $ref: '#/components/responses/SpotifyUnavailable'

  /api/library/suggestions:
    get:
      tags: [library]
      operationId: getLibrarySuggestions
      summary: Followed playlists not yet in the Library (+ modal)
      description: From the last catalog refresh's `GET /me/playlists`. Costs no Web API request.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
          description: Case-insensitive substring of the name or owner.
      responses:
        '200':
          description: The suggestions. Empty means "Nothing to suggest".
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PlaylistPreview' }

  /api/library/resolve:
    post:
      tags: [library]
      operationId: resolveLibraryLink
      summary: Preview a pasted link without adding it (+ modal)
      description: >-
        Resolves the link into a preview row with an Add button, or a reason it can't be used. One
        `GET /playlists/{id}`, which answers with the name, owner, cover and `snapshot_id` even for
        a playlist you don't follow (S0, Q10). A Spotify-made id (`37i9dQZF1…`) is refused without
        asking Spotify, which answers 404 for those.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UrlBody' }
            example: { url: 'spotify:playlist:3cEYpjA9oz9GiPac4AsH4n' }
      responses:
        '200':
          description: The preview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistPreview' }
        '409':
          $ref: '#/components/responses/NotConnected'
        '422':
          $ref: '#/components/responses/LinkRefused'
        '503':
          $ref: '#/components/responses/SpotifyUnavailable'

  /api/library/{id}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    patch:
      tags: [library]
      operationId: patchLibraryItem
      summary: Track or stop tracking an item
      description: >-
        Body `{tracked}`. Works on every kind, `liked` included: wizard step 7's "Include Liked Songs"
        is `PATCH /api/library/liked {tracked}`. Stopping tracking never deletes files.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tracked]
              additionalProperties: false
              properties:
                tracked: { type: boolean }
            example: { tracked: true }
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryItem' }
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [library]
      operationId: removeLibraryItem
      summary: Remove an added item
      description: >-
        Only followed and linked items can be removed (`not_removable` otherwise). Files, the `.m3u`
        and History are kept. An item queued in the current run is removed from the run too.
      responses:
        '204':
          description: Removed.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Owned playlists and Liked Songs can't be removed, only untracked (`not_removable`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/library/{id}/tracks:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [library]
      operationId: getLibraryItemTracks
      summary: The item's track list, with per-track state (detail view)
      description: >-
        In Web API order, which is also the `.m3u` order. A playlist without item access returns the
        tracks recorded so far, in recording order, with `item_access: false` and `position: null`.
      responses:
        '200':
          description: The tracks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackList' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/library/{id}/cover:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [library]
      operationId: getLibraryItemCover
      summary: The playlist's cover image
      description: >-
        `thumb` is the 300 px thumbnail kept in `/config/cache/covers/`; `full` is the largest copy
        stored. Liked Songs has no cover: 404, and the UI draws its tile. Custom covers are deferred,
        so in M1 this is always Spotify's cover.
      parameters:
        - $ref: '#/components/parameters/CoverSize'
      responses:
        '200':
          $ref: '#/components/responses/Image'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/albums:
    get:
      tags: [albums]
      operationId: listAlbums
      summary: The added albums
      description: Filters, searches and sorts on the server, and returns the header's summary counts.
      parameters:
        - name: filter
          in: query
          description: The filter chips. `partial` also matches Unavailable albums with recorded tracks.
          schema:
            type: string
            enum: [all, recorded, queued, partial]
            default: all
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
          description: Case-insensitive substring of the album or the artist.
        - name: sort
          in: query
          description: The sort menu. Ties sort by artist, then album.
          schema:
            type: string
            enum: [recently_added, album, artist, year]
            default: recently_added
      responses:
        '200':
          description: The albums.
          content:
            application/json:
              schema:
                type: object
                required: [items, summary]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Album' }
                  summary:
                    $ref: '#/components/schemas/AlbumsSummary'
    post:
      tags: [albums]
      operationId: addAlbums
      summary: Add albums (+ modal, wizard step 8)
      description: >-
        `{ids: [...]}` adds those saved albums, or `{all: true}` adds every saved album not yet added.
        They start Queued. Choosing "all" again only adds the missing ones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [ids]
                  additionalProperties: false
                  properties:
                    ids:
                      type: array
                      minItems: 1
                      maxItems: 500
                      items: { $ref: '#/components/schemas/SpotifyId' }
                - type: object
                  required: [all]
                  additionalProperties: false
                  properties:
                    all: { type: boolean, const: true }
            examples:
              some:
                value: { ids: [4glBZ0bZMgkmFyi6TD4h69] }
              all:
                value: { all: true }
      responses:
        '200':
          description: What was added, and what wasn't.
          content:
            application/json:
              schema:
                type: object
                required: [added, skipped]
                additionalProperties: false
                properties:
                  added:
                    type: array
                    items: { $ref: '#/components/schemas/Album' }
                  skipped:
                    type: array
                    items:
                      type: object
                      required: [id, reason]
                      additionalProperties: false
                      properties:
                        id: { $ref: '#/components/schemas/SpotifyId' }
                        reason:
                          type: string
                          enum: [already_added, not_saved, not_found]
        '409':
          $ref: '#/components/responses/NotConnected'

  /api/albums/saved:
    get:
      tags: [albums]
      operationId: getSavedAlbums
      summary: Saved albums not yet added (step 8, + modal)
      description: Loaded in full, most recently saved first, so the modal filters without asking again.
      responses:
        '200':
          description: The saved albums.
          content:
            application/json:
              schema:
                type: object
                required: [saved_total, items]
                additionalProperties: false
                properties:
                  saved_total:
                    type: integer
                    minimum: 0
                    description: Every saved album, added or not. Step 8's "You have 42 saved albums".
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SavedAlbum' }
        '409':
          $ref: '#/components/responses/NotConnected'

  /api/albums/{id}:
    parameters:
      - $ref: '#/components/parameters/AlbumId'
    delete:
      tags: [albums]
      operationId: removeAlbum
      summary: Remove an album from the page
      description: Files and History are kept. An album queued in the current run is removed from the run too.
      responses:
        '204':
          description: Removed.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/albums/{id}/tracks:
    parameters:
      - $ref: '#/components/parameters/AlbumId'
    get:
      tags: [albums]
      operationId: getAlbumTracks
      summary: The album's tracks, with per-track state (detail view)
      description: In album order. Album totals are always known, so `item_access` is always true.
      responses:
        '200':
          description: The tracks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackList' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/albums/{id}/cover:
    parameters:
      - $ref: '#/components/parameters/AlbumId'
    get:
      tags: [albums]
      operationId: getAlbumCover
      summary: The album's cover image
      description: '`thumb` is the 300 px thumbnail; `full` is the 640 px cover the Web API gives.'
      parameters:
        - $ref: '#/components/parameters/CoverSize'
      responses:
        '200':
          $ref: '#/components/responses/Image'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/backlog:
    get:
      tags: [runs]
      operationId: getBacklog
      summary: The backlog estimate (step 9, Dashboard)
      description: >-
        design.md § Backlog estimate, with D13. Reading it may start a catalog refresh, at most once
        every 15 minutes and never during a run; the answer is the last estimate, with `as_of`. A
        `backlog` event follows when a refresh changes it. Worked cases: `vectors/backlog.json`.
      responses:
        '200':
          description: The estimate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Backlog' }
              examples:
                scheduled:
                  $ref: '#/components/examples/BacklogScheduled'

  /api/status:
    get:
      tags: [runs]
      operationId: getStatus
      summary: What's happening now
      description: Read on first load; after that the WS keeps it current. The WS `hello` snapshot embeds it.
      responses:
        '200':
          description: The status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
              examples:
                idle:
                  value:
                    state: idle
                    run: null
                    item: null
                    track: null
                    session_state: null
                    view_only: false
                running:
                  $ref: '#/components/examples/StatusRunning'

  /api/runs:
    get:
      tags: [history]
      operationId: listRuns
      summary: History's run list
      description: Newest first, including the missed, skipped and held rows. Pass `next_cursor` back as `cursor` for the next page.
      parameters:
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page. Opaque.
          schema: { type: string, maxLength: 200 }
        - name: filter
          in: query
          description: The filter chips. `with_issues` is `completed_with_issues`, `failed` and the no-run rows.
          schema:
            type: string
            enum: [all, with_issues, scheduled, run_now]
            default: all
        - name: limit
          in: query
          description: Rows per page.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: A page of runs.
          content:
            application/json:
              schema:
                type: object
                required: [runs, next_cursor]
                additionalProperties: false
                properties:
                  runs:
                    type: array
                    items: { $ref: '#/components/schemas/HistoryRow' }
                  next_cursor:
                    type: [string, 'null']
    post:
      tags: [runs]
      operationId: createRun
      summary: Run now, Back up now, Record now, Retry failed
      description: |
        - **Without `items`:** Run now. Starts a forced run of everything due: every tracked playlist, plus
          Queued and Partial albums. Refused with `run_active` while a run is going.
        - **With `items`, no run going:** starts a forced run of just those items.
        - **With `items`, a run going (or paused):** puts them right after the current item, in the given
          order. Items already queued move there.

        Quick checks answer at once with 409: `setup_incomplete`, `connection_expired`,
        `not_connected`, `client_not_installed`, `client_logged_out`. The full pre-run check runs after
        the 202; when it fails, the run ends `failed` with a `failure_reason`, and events say why.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/ItemId' }
            examples:
              runNow:
                value: {}
              backUpNow:
                value: { items: [liked, 4glBZ0bZMgkmFyi6TD4h69] }
      responses:
        '202':
          description: A run started, or the items joined the current one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunCreated' }
              examples:
                started:
                  value: { run_id: 42, started: true, added: [] }
                added:
                  value: { run_id: 41, started: false, added: [4glBZ0bZMgkmFyi6TD4h69] }
        '404':
          description: An item id isn't in the Library or Albums (`not_found`, with `details.ids`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The run can't start. See the description for the codes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                expired:
                  value:
                    error: { code: connection_expired, message: The Spotify connection expired on 12 May 2027. Reconnect to run., details: null }

  /api/runs/last:
    get:
      tags: [runs]
      operationId: getLastRun
      summary: The Dashboard's Last run card
      description: The newest row of kind `run`, with up to three items that had problems. `run` is null before the first run ("No backups yet").
      responses:
        '200':
          description: The last run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LastRun' }

  /api/runs/current:
    get:
      tags: [runs]
      operationId: getCurrentRun
      summary: The current run's queue
      description: The queue, with per-item state and the current item's track list. `run` is null when idle.
      responses:
        '200':
          description: The current run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentRun' }

  /api/runs/current/stop:
    post:
      tags: [runs]
      operationId: stopCurrentRun
      summary: Stop the current run
      description: >-
        `after_track`: nothing is lost; the header says "Stopping after this track…" until it ends.
        `now`: the current take is discarded and recorded next time. Either way the run ends `stopped`.
        Sending `now` after `after_track` upgrades the stop.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              additionalProperties: false
              properties:
                mode:
                  type: string
                  enum: [after_track, now]
            example: { mode: after_track }
      responses:
        '202':
          description: Stopping. `run.state` events follow.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunSummary' }
        '409':
          $ref: '#/components/responses/NoRun'

  /api/runs/current/resume:
    post:
      tags: [runs]
      operationId: resumeCurrentRun
      summary: Resume after a device takeover
      description: >-
        Takes playback back on the container's device and restarts the current item; its recorded
        tracks are skipped as duplicates. Refused with `not_paused` unless the run is paused.
      responses:
        '202':
          description: Resuming.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunSummary' }
        '409':
          description: No run (`no_run`), or the run isn't paused (`not_paused`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/runs/current/items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The item id, as in the queue.
        schema: { $ref: '#/components/schemas/ItemId' }
    delete:
      tags: [runs]
      operationId: removeQueuedItem
      summary: Remove an Up next item from this run
      description: The item gets the `removed` badge in History. The current item can't be removed; stop the run instead.
      responses:
        '204':
          description: Removed from the run.
        '404':
          description: The item isn't waiting in the queue (`not_found`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: It's the current item (`item_is_current`), or there's no run (`no_run`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/runs/{id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [history]
      operationId: getRun
      summary: A run's page
      description: The run header and its items in the order they ran, with counts and badges.
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDetail' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/runs/{id}/items/{item}/tracks:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - name: item
        in: path
        required: true
        description: The item id, as in the run's items.
        schema: { $ref: '#/components/schemas/ItemId' }
    get:
      tags: [history]
      operationId: getRunItemTracks
      summary: An item's tracks and their results in one run
      description: The expanded item on a run page. One row per take, matched to the track list where it could be.
      responses:
        '200':
          description: The tracks.
          content:
            application/json:
              schema:
                type: object
                required: [tracks]
                additionalProperties: false
                properties:
                  tracks:
                    type: array
                    items: { $ref: '#/components/schemas/TrackResult' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/schedule:
    get:
      tags: [schedule]
      operationId: getSchedule
      summary: The weekly hour grid and the run order
      description: The grid, the time zone, the run order, and the week's window and hour counts.
      responses:
        '200':
          description: The schedule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
              examples:
                nightly:
                  $ref: '#/components/examples/ScheduleNightly'
    put:
      tags: [schedule]
      operationId: putSchedule
      summary: Save the grid (set with curl in M1, plan D5)
      description: >-
        Same shape as GET. `tz` is read-only and ignored. Turning off the current hour during a
        scheduled run stops it after the current track. Window rules: `vectors/schedule-windows.json`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleUpdate' }
            examples:
              nightly:
                value:
                  hours: { mon: [1, 2, 3, 4, 5, 6], tue: [1, 2, 3, 4, 5, 6], wed: [1, 2, 3, 4, 5, 6], thu: [1, 2, 3, 4, 5, 6], fri: [1, 2, 3, 4, 5, 6], sat: [0, 1, 2, 3, 4, 5, 6, 7, 8], sun: [0, 1, 2, 3, 4, 5, 6, 7, 8] }
      responses:
        '200':
          description: The saved schedule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/schedule/next:
    get:
      tags: [schedule]
      operationId: getScheduleNext
      summary: The Dashboard's Next backup card
      description: The next window, what it will cover, and why it's held, if it is. Window rules are in `vectors/schedule-windows.json`.
      responses:
        '200':
          description: The next window and what it will cover.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleNext' }

  /api/webapi/usage:
    get:
      tags: [system]
      operationId: getWebApiUsage
      summary: Web API usage totals and 429 history
      description: >-
        From the `api_requests` log (kept 90 days). Totals per endpoint template per day, in UTC days,
        plus every 429. Endpoints are templates (`/playlists/{id}/items`), never ids or tokens. No UI
        in M1; the S10 analysis reads it.
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
          description: How many UTC days back, today included.
      responses:
        '200':
          description: The usage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebApiUsage' }
              examples:
                week:
                  $ref: '#/components/examples/WebApiUsageWeek'
        '422':
          $ref: '#/components/responses/ValidationFailed'

components:
  parameters:
    LibraryId:
      name: id
      in: path
      required: true
      description: A Spotify playlist id, or `liked` for Liked Songs.
      schema: { $ref: '#/components/schemas/LibraryItemId' }
      examples:
        playlist:
          value: 3cEYpjA9oz9GiPac4AsH4n
        liked:
          value: liked
    AlbumId:
      name: id
      in: path
      required: true
      description: A Spotify album id.
      schema: { $ref: '#/components/schemas/SpotifyId' }
    RunId:
      name: id
      in: path
      required: true
      description: A run id from History.
      schema: { type: integer, minimum: 1 }
    CoverSize:
      name: size
      in: query
      description: '`thumb` (300 px, the default) or `full`.'
      schema:
        type: string
        enum: [thumb, full]
        default: thumb

  responses:
    Image:
      description: The image, as stored (JPEG or PNG). Cacheable; the URL changes when the cover does.
      headers:
        Cache-Control:
          schema: { type: string }
          description: '`private, max-age=86400`'
      content:
        image/jpeg:
          schema: { type: string, contentMediaType: image/jpeg }
        image/png:
          schema: { type: string, contentMediaType: image/png }
    NotFound:
      description: No such item (`not_found`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: not_found, message: No such item., details: null }
    ValidationFailed:
      description: The body doesn't match the schema (`validation_failed`), with the field in `details.field`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: validation_failed, message: hours.mon has 24., details: { field: hours.mon } }
    RunActive:
      description: Not allowed while a backup is recording (`run_active`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: run_active, message: Not available while a backup is recording., details: null }
    NoRun:
      description: No run is going (`no_run`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: no_run, message: No backup is running., details: null }
    NotConnected:
      description: The Web API isn't connected (`not_connected`), or the connection expired (`connection_expired`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: not_connected, message: Connect the Spotify Web API first., details: null }
    SpotifyUnavailable:
      description: >-
        The Web API didn't answer after the retries (`spotify_unavailable`), or it's rate limiting
        (`rate_limited`, with `details.retry_after_s`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: rate_limited, message: Spotify asked us to wait., details: { retry_after_s: 30 } }
    Unavailable:
      description: The controller can't serve requests (`internal`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: internal, message: The database can't be opened., details: null }
    LinkRefused:
      description: |
        The link can't be used. Codes:
        - `invalid_url`: not a Spotify playlist link or URI.
        - `not_found`: Spotify has no such playlist.
        - `private`: the playlist is private and not yours.
        - `spotify_owned`: made by Spotify (Discover Weekly, Daily Mixes); not supported.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            spotifyOwned:
              value:
                error: { code: spotify_owned, message: Playlists made by Spotify aren't available through the API., details: null }
            private:
              value:
                error: { code: private, message: This playlist is private., details: null }

  examples:
